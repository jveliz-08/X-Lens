<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="X-Lens architecture">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c5f095"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5b84b"/></marker>
  </defs>
  <rect width="1200" height="600" rx="22" fill="#0b0e11"/>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="26" font-weight="800" fill="#e8edf1">How one motion event flows</text>
    <text x="40" y="80" font-size="15" fill="#8d99a5">The board decides <tspan fill="#c5f095">when</tspan> something happened; Meta models decide <tspan fill="#c5f095">what</tspan> happened, once per event.</text>

    <!-- ESP32-CAM -->
    <rect x="40" y="120" width="250" height="250" rx="16" fill="#12161b" stroke="#2f7a50" stroke-width="2"/>
    <text x="62" y="156" font-size="20" font-weight="700" fill="#e8edf1">📷 ESP32-CAM</text>
    <text x="62" y="178" font-size="13" fill="#8d99a5">C · ESP-IDF 5.4 · OV3660 · $7</text>
    <g font-size="14" fill="#d7dde2">
      <text x="62" y="212">① capture QVGA JPEG</text>
      <text x="62" y="238">② decode at 1/8 scale (28 ms)</text>
      <text x="62" y="264">③ score vs. adaptive background</text>
      <text x="62" y="290">④ skip ignore-zone cells</text>
      <text x="62" y="316">⑤ ~1 fps idle · full rate on</text>
      <text x="62" y="336">    motion or viewers</text>
    </g>

    <!-- arrows ESP <-> host -->
    <line x1="292" y1="200" x2="452" y2="200" stroke="#c5f095" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="300" y="188" font-size="12.5" fill="#c5f095">HTTPS · JPEG + X-Motion</text>
    <line x1="452" y1="290" x2="292" y2="290" stroke="#f5b84b" stroke-width="2.5" marker-end="url(#b)"/>
    <text x="300" y="312" font-size="12.5" fill="#f5b84b">X-Live-Viewers ·</text>
    <text x="300" y="328" font-size="12.5" fill="#f5b84b">X-Motion-Mask</text>

    <!-- Rust host -->
    <rect x="455" y="120" width="330" height="390" rx="16" fill="#12161b" stroke="#c5f095" stroke-width="2"/>
    <text x="477" y="156" font-size="20" font-weight="700" fill="#e8edf1">🦀 X-Lens host</text>
    <text x="477" y="178" font-size="13" fill="#8d99a5">Rust · zero third-party crates · behind Caddy TLS</text>
    <g font-size="14">
      <rect x="477" y="196" width="286" height="40" rx="10" fill="#181d23"/><text x="493" y="221" fill="#d7dde2">🎬 clips with pre-roll + keyframe</text>
      <rect x="477" y="244" width="286" height="40" rx="10" fill="#181d23"/><text x="493" y="269" fill="#d7dde2">👁 watches + ✓/✗ labels</text>
      <rect x="477" y="292" width="286" height="40" rx="10" fill="#181d23"/><text x="493" y="317" fill="#d7dde2">🧓 routines (no AI needed)</text>
      <rect x="477" y="340" width="286" height="40" rx="10" fill="#181d23"/><text x="493" y="365" fill="#d7dde2">🗺 ignore zones per camera</text>
      <rect x="477" y="388" width="286" height="40" rx="10" fill="#181d23"/><text x="493" y="413" fill="#d7dde2">🔐 replay-safe ingest · budgets</text>
      <rect x="477" y="436" width="286" height="54" rx="10" fill="#1c2a14" stroke="#c5f095" stroke-opacity=".5"/>
      <text x="493" y="459" fill="#c5f095" font-weight="700">vision worker · strict JSON schemas</text>
      <text x="493" y="479" fill="#8d99a5" font-size="12.5">tools/vision.py · segment.py · voice.py</text>
    </g>

    <!-- Meta -->
    <rect x="890" y="120" width="270" height="250" rx="16" fill="#12161b" stroke="#5b8cff" stroke-width="2"/>
    <text x="912" y="156" font-size="20" font-weight="700" fill="#e8edf1">∞ Meta Model API</text>
    <text x="912" y="178" font-size="13" fill="#8d99a5">one key, pasted in the dashboard</text>
    <g font-size="14">
      <rect x="912" y="196" width="226" height="48" rx="10" fill="#151c2b"/><text x="926" y="216" fill="#e8edf1" font-weight="700">✦ Muse Spark 1.3</text><text x="926" y="235" fill="#8d99a5" font-size="12">events · watches · Ask · day summary</text>
      <rect x="912" y="252" width="226" height="48" rx="10" fill="#151c2b"/><text x="926" y="272" fill="#e8edf1" font-weight="700">◎ SAM 3.1</text><text x="926" y="291" fill="#8d99a5" font-size="12">"tree" → boxes → ignore mask</text>
      <rect x="912" y="308" width="226" height="48" rx="10" fill="#151c2b"/><text x="926" y="328" fill="#e8edf1" font-weight="700">🎙 Muse Voice Transcribe</text><text x="926" y="347" fill="#8d99a5" font-size="12">push-to-talk questions</text>
    </g>
    <line x1="787" y1="452" x2="1020" y2="452" stroke="#5b8cff" stroke-width="2.5"/>
    <line x1="1020" y1="452" x2="1020" y2="374" stroke="#5b8cff" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="800" y="440" font-size="12.5" fill="#8fb0ff">1 call per event — never per frame</text>

    <!-- Browser -->
    <rect x="40" y="410" width="360" height="150" rx="16" fill="#12161b" stroke="#323b45" stroke-width="2"/>
    <text x="62" y="446" font-size="20" font-weight="700" fill="#e8edf1">🖥 Dashboard</text>
    <text x="62" y="468" font-size="13" fill="#8d99a5">plain HTML / CSS / JS · any browser</text>
    <g font-size="14" fill="#d7dde2">
      <text x="62" y="498">live MJPEG · timeline · clip player</text>
      <text x="62" y="522">Ask by text or 🎤 voice · alerts 🔔 · 🔊</text>
      <text x="62" y="546">zones editor · routines · summaries</text>
    </g>
    <line x1="402" y1="485" x2="452" y2="485" stroke="#c5f095" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>

    <!-- Boundary -->
    <rect x="820" y="410" width="0" height="0"/>
    <text x="1160" y="580" font-size="13" fill="#8d99a5" text-anchor="end">🛡 The model describes and suggests — it never acts. Footage stays on your host.</text>
  </g>
</svg>
